; Node firmware for the LoRa ramp tide sensor (ARCHITECTURE 4.8, ADR-001).
; Board env: NOT built yet (needs the Arduino-ESP32 framework, MeshCore and real drivers;
; spike S1 first). The portable core in lib/tidecore is host-tested with
; `make -C firmware/test/host` (or CMake); see docs/BUILD.md.

[platformio]
default_envs = heltec_v3_tide

[env:heltec_v3_tide]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17 -Wall
lib_deps =
    ; MeshCore pinned by git tag, not library version (library.json still says 1.10.0)
    https://github.com/meshcore-dev/MeshCore.git#companion-v1.17.1

; Host build of the portable core only (no Arduino, no MeshCore). The tests themselves run
; through test/host/Makefile so they need no PlatformIO test framework download.
[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
build_src_filter = -<*>
lib_compat_mode = off
