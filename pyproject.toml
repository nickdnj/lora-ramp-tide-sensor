[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-ramp-tide-sensor"
version = "0.1.0"
description = "tidesvc ingest/derive/API service and an offline simulator for the LoRa ramp tide sensor"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
# meshcore is only needed on the mini PC with a real gateway radio attached.
radio = ["meshcore==2.3.15"]
# The simulator uses numpy; matplotlib is optional (plots only).
sim = ["numpy>=1.26"]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "respx>=0.21", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tidesvc*", "sim*"]

[tool.setuptools.package-data]
tidesvc = ["config.example.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: long-running simulation tests (still offline)",
]

[tool.ruff]
line-length = 120
